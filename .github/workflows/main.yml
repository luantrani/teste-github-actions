name: Teste Matrix

on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qualidade:

   strategy:
     matrix: 
      os: [ubuntu-latest, windows-latest, macos-latest]

      runs-on: ${{ matrix.os }}

      steps:
      -name: baixar codigo
       uses: actions/checkout@v4

       -name: instalar pyton
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

          -name: instalar pytest
           run: pip install pytest

           -name: executar testes
            run: pytest
        
        
